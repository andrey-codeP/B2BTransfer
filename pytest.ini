[pytest]

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

addopts =
    -v
    --strict-markers
    --cov=app



testpaths = tests


markers =
    smoke: дым тесты
    regression: регрессивные тесты
    slow: медленны тесты
    asyncio: асинхронное тестирование
